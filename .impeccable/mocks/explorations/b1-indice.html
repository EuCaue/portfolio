<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B1 · Índice primeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* The work leads: intro is a strip, the project index owns the first viewport. */
.intro { display: grid; gap: var(--s6); padding-top: var(--s8); padding-bottom: var(--s8); align-items: end; }
@media (min-width: 1024px) { .intro { grid-template-columns: auto 1fr auto; gap: var(--s12); } }
.intro h1 { font-size: clamp(44px, 5.4vw, 80px); line-height: 0.9; font-weight: 850; font-variation-settings: "wdth" 62; text-transform: uppercase; }
.intro h1 small { display: block; font-size: 0.32em; font-weight: 600; font-variation-settings: "wdth" 112; color: var(--muted); margin-top: var(--s2); text-transform: none; }
.intro p { color: var(--muted); max-width: 52ch; font-size: 16px; }
#projects { border-top: 1px solid var(--line); padding-top: var(--s8); }
.work { display: grid; gap: var(--s12); }
@media (min-width: 1024px) { .work { grid-template-columns: 7fr 5fr; gap: var(--s12); } }
.idx { font-size: clamp(34px, 4.8vw, 78px); line-height: 1.0; font-weight: 750; font-variation-settings: "wdth" 62; text-transform: uppercase; }
.idx button { background: none; border: 0; padding: 0; cursor: pointer; text-transform: inherit; font-weight: inherit; line-height: inherit; text-align: left; }
.idx button.other { color: var(--muted); font-weight: 350; }
.idx button[aria-pressed="true"] { color: var(--accent-ink); }
.idx .sep { color: var(--line); padding: 0 0.16em; font-weight: 300; }
.panel { align-self: start; }
@media (min-width: 1024px) { .panel { position: sticky; top: 88px; } }
.legend { margin-top: var(--s6); font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="wrap intro">
    <h1>Cauê Souza<small>Software Engineer, Salvador, Brazil</small></h1>
    <p>Software Engineer passionate about building complete digital solutions from web and mobile applications to native desktop integrations and system-level tooling.</p>
    <div class="ctas"><a class="btn primary" href="#">Download CV</a><a class="btn" href="#contact">Get In Touch</a></div>
  </div>
  <section id="projects">
    <div class="wrap work">
      <div>
        <h2 class="sr">Projects</h2>
        <p class="idx" id="idx"></p>
        <p class="legend">Featured projects in full ink. Other projects in gray.</p>
      </div>
      <article class="panel" id="panel" aria-live="polite"></article>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
document.querySelector("main").insertAdjacentHTML("beforeend", ABOUT + CONTACT());
chrome();
const idx = document.getElementById("idx"), panel = document.getElementById("panel");
idx.innerHTML = PROJECTS.map((p, i) =>
  `<button type="button" class="${p.featured ? "" : "other"}" data-i="${i}" aria-pressed="false">${p.name}</button>`
).join('<span class="sep" aria-hidden="true">/</span>');
const select = i => {
  idx.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.i == i));
  panel.innerHTML = panelHTML(PROJECTS[i]);
};
idx.addEventListener("click", e => { const b = e.target.closest("button"); if (b) select(+b.dataset.i); });
select(0);
proximity(idx, { radius: 150 });
</script>
</body>
</html>
