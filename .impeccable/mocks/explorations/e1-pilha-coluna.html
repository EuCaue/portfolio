<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E1 · Pilha com coluna fixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* C3's one-bit card world on D3's structure: a fixed identity window, a scrolling stack of project windows.
   The window in view is the active one: striped title bar, deep shadow. Cobalt only for the primary action and focus. */
:root {
  --paper: #fbfbf8; --ink: #111111; --muted: #444444; --accent: #1d47c9; --on-accent: #ffffff; --err: #a3001b;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px; --s16: 64px;
  --t-xs: 13px; --t-sm: 15px; --t-base: 16px; --t-md: 20px; --t-lg: 28px; --t-xl: 40px; --t-2xl: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #121212; --ink: #f2f2ee; --muted: #c4c4c0; --accent: #8fb0ff; --on-accent: #0a1433; --err: #ff9aa8; }
}
:root[data-theme="dark"] { --paper: #121212; --ink: #f2f2ee; --muted: #c4c4c0; --accent: #8fb0ff; --on-accent: #0a1433; --err: #ff9aa8; }
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { color: var(--ink); background: var(--paper); font: 400 var(--t-base)/1.6 "Public Sans", system-ui, sans-serif; }
@media (min-width: 1024px) { body { background: var(--paper) repeating-conic-gradient(var(--ink) 0 25%, transparent 0 50%) 0 0 / 4px 4px; } }
::selection { background: var(--ink); color: var(--paper); }
a, button { color: inherit; font: inherit; }
a { text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.px { font-family: "Pixelify Sans", monospace; }

/* menubar: the system bar across the top of the desk */
.menubar { position: sticky; top: 0; z-index: 10; height: 40px; display: flex; align-items: center; gap: var(--s1); padding: 0 var(--s2); background: var(--paper); border-bottom: 2px solid var(--ink); font: 400 17px "Pixelify Sans", monospace; }
.menubar a, .menubar button { background: none; border: 0; padding: var(--s1) var(--s3); cursor: pointer; text-decoration: none; white-space: nowrap; }
.menubar a:hover, .menubar button:hover { background: var(--ink); color: var(--paper); }
.menubar .name { font-weight: 700; }
.menubar .right { margin-left: auto; display: flex; }
.menubar .mob { display: inline; }
@media (max-width: 479px) { .menubar .right { display: none; } .menubar a, .menubar button { padding: var(--s1) var(--s2); } }
.prefs { display: none; gap: var(--s3); margin-top: var(--s4); }
@media (max-width: 479px) { .prefs { display: flex; } }
@media (min-width: 1024px) { .menubar .mob { display: none; } }

.desk { max-width: 1280px; margin: 0 auto; padding: var(--s4); display: grid; gap: var(--s8); }
@media (min-width: 1024px) { .desk { grid-template-columns: 400px minmax(0, 1fr); gap: var(--s12); padding: var(--s8) var(--s8) var(--s16); align-items: start; } }

/* window */
.win { background: var(--paper); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); transition: box-shadow 160ms ease-out; }
.win.is-active { box-shadow: 6px 6px 0 var(--ink); }
@media (max-width: 767px) { .win.is-active { box-shadow: 4px 4px 0 var(--ink); } }
.bar { height: 32px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid var(--ink); padding: 0 var(--s2); }
.is-active > .bar { background: repeating-linear-gradient(var(--ink) 0 2px, transparent 2px 4px) center / 100% 16px no-repeat; }
.bar h2, .bar h3, .bar span { background: var(--paper); padding: 0 var(--s3); font: 400 17px/1 "Pixelify Sans", monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.body { padding: var(--s6); }
@media (min-width: 768px) { .body { padding: var(--s8); } }
@media (prefers-reduced-motion: reduce) { .win { transition: none; } }

/* identity window */
@media (min-width: 1024px) { .ident { position: sticky; top: 72px; } }
/* the identity window is pinned, not focused: inverted title bar, permanent deep shadow */
.ident { box-shadow: 6px 6px 0 var(--ink); }
@media (max-width: 767px) { .ident { box-shadow: 4px 4px 0 var(--ink); } }
.ident > .bar { background: var(--ink); }
.ident > .bar span { background: var(--ink); color: var(--paper); }
.ident h1 { font: 700 var(--t-2xl)/1 "Pixelify Sans", monospace; }
.ident .role { font: 400 var(--t-md)/1.3 "Pixelify Sans", monospace; margin-top: var(--s3); }
.ident .intro { margin-top: var(--s4); color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s6); }
.b { display: inline-flex; align-items: center; height: 44px; padding: 0 var(--s6); border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; text-decoration: none; font: 400 18px "Pixelify Sans", monospace; white-space: nowrap; }
.b:hover { background: var(--ink); color: var(--paper); }
.b:active { box-shadow: none; transform: translate(2px, 2px); }
.b.primary { background: var(--accent); color: var(--on-accent); }
.b.primary:hover { filter: brightness(1.12); }
.b:disabled { opacity: .6; cursor: progress; }
.index { list-style: none; padding: 0; margin-top: var(--s8); border: 2px solid var(--ink); }
.index a { display: flex; justify-content: space-between; padding: var(--s2) var(--s3); text-decoration: none; font: 400 17px "Pixelify Sans", monospace; }
.index li + li a { border-top: 1px dotted var(--ink); }
.index a:hover, .index a[aria-current="true"] { background: var(--ink); color: var(--paper); }
.index small { font-size: var(--t-xs); }
.elsewhere { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); margin-top: var(--s6); font-size: var(--t-sm); }
@media (max-width: 1023px) { .index { display: none; } }

/* stack */
.stack { display: grid; gap: var(--s8); min-width: 0; }
@media (min-width: 1024px) { .stack { gap: var(--s12); } }
.label { justify-self: start; background: var(--paper); border: 2px solid var(--ink); padding: var(--s2) var(--s4); font: 700 var(--t-lg)/1 "Pixelify Sans", monospace; }
.group { display: grid; gap: var(--s8); scroll-margin-top: 64px; }

.pic { border: 2px solid var(--ink); aspect-ratio: 16 / 10; overflow: hidden; display: grid; place-items: center; background: repeating-conic-gradient(var(--ink) 0 25%, transparent 0 50%) 0 0 / 2px 2px; }
.pic video, .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic .none { background: var(--paper); border: 2px solid var(--ink); padding: var(--s2) var(--s4); max-width: 80%; text-align: center; font: 400 var(--t-md)/1.3 "Pixelify Sans", monospace; }
.proj { display: grid; gap: var(--s6); }
@media (min-width: 1280px) { .proj.wide { grid-template-columns: 3fr 2fr; align-items: start; } }
.proj p { max-width: 62ch; }
.meta { display: grid; gap: var(--s3); font-size: var(--t-sm); }
.meta dt { font: 400 var(--t-sm) "Pixelify Sans", monospace; }
.meta dd { color: var(--muted); }
.tags { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 0 var(--s3); }

.more { list-style: none; padding: 0; }
.more li { display: grid; gap: var(--s3); padding: var(--s6) 0; }
.more li + li { border-top: 1px dotted var(--ink); }
.more li:first-child { padding-top: 0; }
.more li:last-child { padding-bottom: 0; }
@media (min-width: 768px) { .more li { grid-template-columns: 176px minmax(0, 1fr); gap: var(--s6); } }
.more .pic { aspect-ratio: 16 / 10; }
.more h3 { font: 700 var(--t-md)/1.2 "Pixelify Sans", monospace; }
.more .plat { font-size: var(--t-xs); color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); font-weight: 600; font-size: var(--t-sm); }

.about { display: grid; gap: var(--s8); }
.about p + p { margin-top: var(--s4); }
.about p { max-width: 62ch; }
.skills { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--s6); }
.skills h3 { font: 700 18px "Pixelify Sans", monospace; margin-bottom: var(--s1); }
.skills ul { list-style: none; padding: 0; font-size: var(--t-sm); color: var(--muted); }

.contact { display: grid; gap: var(--s8); }
@media (min-width: 1280px) { .contact { grid-template-columns: 2fr 3fr; } }
.contact a.big { display: block; font-weight: 700; margin-top: var(--s2); }
form { display: grid; gap: var(--s4); }
.field { display: grid; gap: var(--s1); }
label { font: 400 17px "Pixelify Sans", monospace; }
input, textarea { font: var(--t-base) "Public Sans", sans-serif; border: 2px solid var(--ink); border-radius: 0; background: var(--paper); color: var(--ink); padding: var(--s2) var(--s3); }
input::placeholder, textarea::placeholder { color: var(--muted); }
[aria-invalid="true"] { border-color: var(--err); }
textarea { min-height: 128px; resize: vertical; }
.err { color: var(--err); font-size: var(--t-xs); min-height: 0; }
.err:empty { display: none; }
.form-foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s4); }
.ok { font-weight: 600; }

.foot { justify-self: start; background: var(--paper); border: 2px solid var(--ink); padding: var(--s2) var(--s4); font-size: var(--t-xs); display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); }
</style>
</head>
<body>
<nav class="menubar" aria-label="Main">
  <a class="name" href="#top">Cauê Souza</a>
  <a class="mob" href="#contact">Contact</a>
  <a class="mob" href="#">Resume</a>
  <span class="right"><button type="button" aria-label="Change language">EN</button><button type="button" onclick="toggleTheme()" aria-label="Toggle theme">Theme</button></span>
</nav>
<div class="desk" id="top">
  <aside class="win ident" aria-labelledby="who">
    <div class="bar"><span>Cauê Souza</span></div>
    <div class="body">
      <h1 id="who">Cauê Souza</h1>
      <p class="role">Software Engineer, Salvador, Brazil</p>
      <p class="intro" id="intro"></p>
      <div class="btns"><a class="b primary" href="#">Download CV</a><a class="b" href="#contact">Get In Touch</a></div>
      <ul class="index" id="index"></ul>
      <p class="elsewhere"><a href="https://github.com/EuCaue">GitHub</a><a href="https://linkedin.com/in/caue-souza">LinkedIn</a><a href="https://eucaue.online">eucaue.online</a><a href="https://blog.eucaue.online">Blog</a></p>
      <p class="prefs"><button class="b" type="button" aria-label="Change language">EN</button><button class="b" type="button" onclick="toggleTheme()" aria-label="Toggle theme">Theme</button></p>
    </div>
  </aside>
  <main class="stack" id="stack"></main>
</div>
<script src="data.js"></script>
<script src="e-shared.js"></script>
<script>
document.getElementById("intro").textContent = INTRO;
const liveLink = p => p.preview ? `<a href="${p.preview}">Live Demo</a>` : "";
const ghLink = p => p.github ? `<a href="${p.github}">GitHub</a>` : "";

const featuredWin = (p, i) => `
  <article class="win" id="${slug(p.name)}" aria-labelledby="t-${slug(p.name)}">
    <div class="bar"><h3 id="t-${slug(p.name)}">${p.name}</h3></div>
    <div class="body proj wide">
      <div class="pic">${media(p) || `<span class="none">No preview available</span>`}</div>
      <div class="meta-col">
        <p>${p.desc}</p>
        <dl class="meta" style="margin-top:24px">
          <div><dt>Platform</dt><dd>${PLATFORM_LABEL[p.platform]}</dd></div>
          <div><dt>Built with</dt><dd><ul class="tags">${p.tags.map(t => `<li>${t}</li>`).join("")}</ul></dd></div>
          ${p.preview ? `<div><dt>Published</dt><dd>${host(p.preview)}</dd></div>` : ""}
        </dl>
        <div class="btns">${p.github ? `<a class="b" href="${p.github}">GitHub</a>` : ""}${p.preview ? `<a class="b" href="${p.preview}">Live Demo</a>` : ""}</div>
      </div>
    </div>
  </article>`;

const moreWin = (title, list, id) => `
  <section class="win" aria-labelledby="${id}">
    <div class="bar"><h3 id="${id}">${title}</h3></div>
    <div class="body"><ul class="more">${list.map(p => `
      <li id="${slug(p.name)}">
        <div class="pic">${media(p) || `<span class="none">CLI</span>`}</div>
        <div>
          <h3>${p.name}</h3>
          <p class="plat">${PLATFORM_LABEL[p.platform]}${p.preview ? `, published on ${host(p.preview)}` : ""}</p>
          <p style="margin:8px 0 12px">${p.desc}</p>
          <p class="links">${ghLink(p)}${liveLink(p)}</p>
        </div>
      </li>`).join("")}</ul></div>
  </section>`;

const groups = [
  ["web", "Web & mobile", byFamily("web")],
  ["desktop", "Desktop & Linux", byFamily("desktop")],
];
document.getElementById("stack").innerHTML = groups.map(([id, label, list]) => `
  <div class="group" id="${id}">
    <h2 class="label">${label}</h2>
    ${list.filter(p => p.featured).map(featuredWin).join("")}
    ${moreWin(`More ${label.toLowerCase()}`, list.filter(p => !p.featured), `more-${id}`)}
  </div>`).join("") + `
  <section class="win" id="about" aria-labelledby="about-t">
    <div class="bar"><h2 id="about-t">About Me</h2></div>
    <div class="body about">
      <div>${ABOUT_P.map(t => `<p>${t}</p>`).join("")}</div>
      <div class="skills">${SKILLS.map(([h, items]) => `<div><h3>${h}</h3><ul>${items.map(s => `<li>${s}</li>`).join("")}</ul></div>`).join("")}</div>
    </div>
  </section>
  <section class="win" id="contact" aria-labelledby="contact-t">
    <div class="bar"><h2 id="contact-t">Get In Touch</h2></div>
    <div class="body contact">
      <div>
        <p>Have a project in mind or just want to say hello? Feel free to reach out!</p>
        <a class="big" href="mailto:souzacaue@proton.me">souzacaue@proton.me</a>
        <a class="big" href="https://linkedin.com/in/caue-souza">LinkedIn</a>
        <a class="big" href="https://github.com/EuCaue">GitHub</a>
      </div>
      ${formHTML("cf")}
    </div>
  </section>
  <footer class="foot"><span>© 2026 Cauê Souza. All rights reserved.</span><a href="https://eucaue.online">eucaue.online</a><a href="https://blog.eucaue.online">Blog</a><a href="#">Resume</a></footer>`;
document.querySelector("#cf .send").className = "b primary send";
mockForm(document.getElementById("cf"));
playInView();

// index of the stack, mirrored in the identity window
const entries = [["web", "Web & mobile", byFamily("web").length], ["desktop", "Desktop & Linux", byFamily("desktop").length], ["about", "About"], ["contact", "Contact"]];
document.getElementById("index").innerHTML = entries.map(([id, l, n]) => `<li><a href="#${id}"><span>${l}</span>${n ? `<small>${n} projects</small>` : ""}</a></li>`).join("");

// The window crossing the reading line becomes the active window; its group lights up in the index.
const wins = [...document.querySelectorAll("#stack .win")];
const idx = [...document.querySelectorAll("#index a")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  wins.forEach(w => w.classList.toggle("is-active", w === e.target));
  const g = e.target.closest(".group")?.id || e.target.id;
  idx.forEach(a => a.setAttribute("aria-current", String(a.hash === "#" + g)));
}), { rootMargin: "-35% 0px -60% 0px" });
wins.forEach(w => io.observe(w));
</script>
</body>
</html>
