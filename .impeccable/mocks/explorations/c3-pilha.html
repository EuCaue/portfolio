<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C3 · Pilha de cartões</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* A one-bit card stack: black on paper, dithered desk, cobalt only for the active control. */
:root {
  --paper: #fbfbf8; --ink: #111111; --muted: #444444; --accent: #1d47c9; --on-accent: #ffffff;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px; --s16: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #121212; --ink: #f2f2ee; --muted: #c4c4c0; --accent: #8fb0ff; --on-accent: #0a1433; }
}
:root[data-theme="dark"] { --paper: #121212; --ink: #f2f2ee; --muted: #c4c4c0; --accent: #8fb0ff; --on-accent: #0a1433; }
* { box-sizing: border-box; margin: 0; }
body { min-height: 100dvh; color: var(--ink); font: 400 16px/1.55 "Public Sans", system-ui, sans-serif;
  background: var(--paper) repeating-conic-gradient(var(--ink) 0 25%, transparent 0 50%) 0 0 / 4px 4px; }
@media (max-width: 767px) { body { background: var(--paper); } }
a, button { color: inherit; font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.px { font-family: "Pixelify Sans", monospace; }

.window { background: var(--paper); border: 2px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); max-width: 1040px; margin: var(--s8) auto; display: flex; flex-direction: column; min-height: min(720px, calc(100dvh - 64px)); }
@media (max-width: 767px) { .window { margin: 0; border: 0; box-shadow: none; min-height: 100dvh; } }
.menubar { display: flex; align-items: center; gap: var(--s1); border-bottom: 2px solid var(--ink); padding: 0 var(--s2); height: 44px; font-family: "Pixelify Sans"; font-size: 17px; overflow-x: auto; }
.menubar button, .menubar a { background: none; border: 0; padding: var(--s1) var(--s3); cursor: pointer; text-decoration: none; white-space: nowrap; }
.menubar button:hover, .menubar a:hover { background: var(--ink); color: var(--paper); }
.menubar .logo { font-weight: 700; }
.menubar .right { margin-left: auto; display: flex; }

.cardarea { flex: 1; padding: var(--s8) var(--s6); }
@media (min-width: 768px) { .cardarea { padding: var(--s12); } }
.c[hidden] { display: none; }
.c h1, .c h2 { font-family: "Pixelify Sans"; font-weight: 700; line-height: 1; }
.c h1 { font-size: clamp(48px, 8vw, 104px); }
.c h2 { font-size: clamp(32px, 4.4vw, 56px); margin-bottom: var(--s6); }
.c .lead { font-family: "Pixelify Sans"; font-size: clamp(20px, 2.4vw, 30px); margin-top: var(--s3); }
.c p { max-width: 58ch; }
.home { display: grid; gap: var(--s8); align-content: center; min-height: 100%; }

/* painted buttons: round-rect, inverts when pressed, cobalt when it is the current card */
.btns { display: flex; flex-wrap: wrap; gap: var(--s3); }
.b { display: inline-flex; align-items: center; height: 44px; padding: 0 var(--s6); border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); box-shadow: 2px 2px 0 var(--ink); cursor: pointer; text-decoration: none; font-family: "Pixelify Sans"; font-size: 18px; white-space: nowrap; }
.b:active { background: var(--ink); color: var(--paper); box-shadow: none; transform: translate(2px, 2px); }
.b.primary { background: var(--accent); color: var(--on-accent); border-color: var(--ink); }

.field { border: 2px solid var(--ink); padding: var(--s2); max-height: 420px; overflow-y: auto; columns: 1; }
@media (min-width: 768px) { .field { columns: 2; column-rule: 1px dotted var(--ink); } }
.field button { display: flex; width: 100%; justify-content: space-between; gap: var(--s3); background: none; border: 0; padding: var(--s1) var(--s2); cursor: pointer; text-align: left; break-inside: avoid; }
.field button:hover { background: var(--ink); color: var(--paper); }
.field .other { color: var(--muted); }
.field small { font-family: "Pixelify Sans"; font-size: 14px; }

.proj { display: grid; gap: var(--s6); }
@media (min-width: 900px) { .proj { grid-template-columns: 6fr 5fr; gap: var(--s8); } }
.pic { border: 2px solid var(--ink); aspect-ratio: 16 / 10; overflow: hidden; display: grid; place-items: center; background: repeating-conic-gradient(var(--ink) 0 25%, transparent 0 50%) 0 0 / 2px 2px; }
.pic video, .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pic span { background: var(--paper); padding: var(--s1) var(--s3); border: 2px solid var(--ink); font-family: "Pixelify Sans"; }
.tags { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); font-family: "Pixelify Sans"; font-size: 15px; margin: var(--s4) 0; }
.pub { font-family: "Pixelify Sans"; color: var(--accent); }

.about { display: grid; gap: var(--s8); }
@media (min-width: 900px) { .about { grid-template-columns: 7fr 5fr; } }
.about p + p { margin-top: var(--s4); }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
.skills h3 { font-family: "Pixelify Sans"; font-size: 18px; }
.skills ul { list-style: none; padding: 0; font-size: 14px; }
.contact { display: grid; gap: var(--s8); }
@media (min-width: 900px) { .contact { grid-template-columns: 5fr 6fr; } }
.contact a.big { display: block; font-weight: 700; margin-top: var(--s2); text-underline-offset: 4px; }
form { display: grid; gap: var(--s4); }
form label { font-family: "Pixelify Sans"; font-size: 17px; display: grid; gap: var(--s1); }
input, textarea { font: 16px "Public Sans", sans-serif; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); padding: var(--s2) var(--s3); }
textarea { min-height: 120px; }

.navbar { border-top: 2px solid var(--ink); display: flex; justify-content: space-between; align-items: center; padding: var(--s2) var(--s4); font-family: "Pixelify Sans"; }
.arrow { background: none; border: 2px solid var(--ink); border-radius: 10px; width: 48px; height: 36px; cursor: pointer; font-size: 18px; }
.arrow:active { background: var(--ink); color: var(--paper); }
.navbar .foot { font-family: "Public Sans"; font-size: 13px; color: var(--muted); text-align: center; }
.navbar .foot a { text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="window">
  <nav class="menubar" aria-label="Main">
    <button class="logo" data-go="home">Cauê Souza</button>
    <button data-go="projects">Projects</button>
    <button data-go="about">About</button>
    <button data-go="contact">Contact</button>
    <a href="#">Resume</a>
    <span class="right"><button aria-label="Change language">EN</button><button onclick="toggleTheme()" aria-label="Toggle theme">Theme</button></span>
  </nav>
  <main class="cardarea" id="cards" aria-live="polite"></main>
  <div class="navbar">
    <button class="arrow" id="prev" aria-label="Previous card">&lt;</button>
    <span class="foot">© 2026 Cauê Souza. <a href="https://eucaue.online">eucaue.online</a> · <a href="https://blog.eucaue.online">Blog</a></span>
    <button class="arrow" id="next" aria-label="Next card">&gt;</button>
  </div>
</div>
<script src="data.js"></script>
<script>
const projectCard = (p, i) => `
  <section class="c" data-id="p${i}" hidden>
    <h2>${p.name}</h2>
    <div class="proj">
      <div class="pic">${media(p) || "<span>No preview available</span>"}</div>
      <div>
        <p>${p.desc}</p>
        <ul class="tags">${p.tags.map(t => `<li>${t}</li>`).join("")}</ul>
        <div class="btns">
          ${p.github ? `<a class="b" href="${p.github}">GitHub</a>` : ""}
          ${p.preview ? `<a class="b" href="${p.preview}">Live Demo</a>` : ""}
          <button class="b" data-go="projects">All projects</button>
        </div>
        ${p.preview ? '<p class="pub" style="margin-top:16px">Published</p>' : ""}
      </div>
    </div>
  </section>`;

document.getElementById("cards").innerHTML = `
  <section class="c home" data-id="home">
    <div>
      <h1>Cauê Souza</h1>
      <p class="lead">Software Engineer, Salvador, Brazil</p>
    </div>
    <p>Software Engineer passionate about building complete digital solutions from web and mobile applications to native desktop integrations and system-level tooling.</p>
    <div class="btns"><a class="b primary" href="#">Download CV</a><button class="b" data-go="projects">View My Work</button><button class="b" data-go="contact">Get In Touch</button></div>
  </section>
  <section class="c" data-id="projects" hidden>
    <h2>Projects</h2>
    <div class="field">${PROJECTS.map((p, i) => `<button class="${p.featured ? "" : "other"}" data-go="p${i}"><span>${p.name}</span><small>${p.platform}</small></button>`).join("")}</div>
  </section>
  ${PROJECTS.map(projectCard).join("")}
  <section class="c" data-id="about" hidden>
    <h2>About Me</h2>
    <div class="about">
      <div>
        <p>I'm a software engineer who enjoys working across different layers of technology. My experience spans modern, responsive interfaces for web and mobile (React, Next.js, React Native) all the way to native desktop applications and system extensions for Linux/GNOME built with Python and JavaScript.</p>
        <p>I believe in using technology to solve real-world problems simply and efficiently. I combine technical rigor, sound design principles, and smart automation in my daily workflow to build experiences that are robust under the hood and seamless for the user.</p>
      </div>
      <div class="skills">${SKILLS.map(([h, items]) => `<div><h3>${h}</h3><ul>${items.map(s => `<li>${s}</li>`).join("")}</ul></div>`).join("")}</div>
    </div>
  </section>
  <section class="c" data-id="contact" hidden>
    <h2>Get In Touch</h2>
    <div class="contact">
      <div>
        <p>Have a project in mind or just want to say hello? Feel free to reach out!</p>
        <a class="big" href="mailto:souzacaue@proton.me">souzacaue@proton.me</a>
        <a class="big" href="https://linkedin.com/in/caue-souza">LinkedIn</a>
        <a class="big" href="https://github.com/EuCaue">GitHub</a>
      </div>
      <form onsubmit="event.preventDefault()">
        <label>Name<input placeholder="Your name" autocomplete="name"></label>
        <label>Email<input type="email" placeholder="Your email" autocomplete="email"></label>
        <label>Message<textarea placeholder="Your message"></textarea></label>
        <div class="btns"><button class="b primary" type="submit">Send Message</button></div>
      </form>
    </div>
  </section>`;

const cards = [...document.querySelectorAll(".c")];
let cur = 0;
const show = n => {
  cur = (n + cards.length) % cards.length;
  cards.forEach((c, k) => (c.hidden = k !== cur));
  cards[cur].querySelector("h1, h2")?.setAttribute("tabindex", "-1");
};
const go = id => { show(cards.findIndex(c => c.dataset.id === id)); cards[cur].querySelector("h1, h2").focus(); };
document.addEventListener("click", e => { const t = e.target.closest("[data-go]"); if (t) go(t.dataset.go); });
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "ArrowRight") show(cur + 1);
  if (e.key === "ArrowLeft") show(cur - 1);
});
show(0);
</script>
</body>
</html>
