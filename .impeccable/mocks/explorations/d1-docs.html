<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D1 · Documentação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Reads like well-made technical docs: sidebar index, one content column, facts in tables. */
:root {
  --bg: #fbfbfa; --side: #f3f3f1; --ink: #18181b; --muted: #55555c; --line: #e2e2df; --code: #efefec;
  --accent: #047857; --on-accent: #ffffff;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px; --s16: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #111113; --side: #18181b; --ink: #ececee; --muted: #a1a1aa; --line: #2a2a2e; --code: #1f1f23; --accent: #34d399; --on-accent: #052e22; }
}
:root[data-theme="dark"] { --bg: #111113; --side: #18181b; --ink: #ececee; --muted: #a1a1aa; --line: #2a2a2e; --code: #1f1f23; --accent: #34d399; --on-accent: #052e22; }
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.7 "Geist", system-ui, sans-serif; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: "Geist Mono", monospace; font-size: 13px; }
code { background: var(--code); padding: 2px 6px; border-radius: 4px; }

.top { position: sticky; top: 0; z-index: 10; height: 56px; display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s4); background: var(--bg); border-bottom: 1px solid var(--line); }
.top .logo { font-weight: 600; text-decoration: none; }
.top .right { margin-left: auto; display: flex; gap: var(--s2); align-items: center; }
.top a.ext { font-size: 14px; color: var(--muted); text-decoration: none; padding: 0 var(--s2); }
.top a.ext:hover { color: var(--ink); }
.icon-btn { background: none; border: 1px solid var(--line); height: 32px; padding: 0 var(--s3); border-radius: 6px; cursor: pointer; font: 13px "Geist"; color: var(--ink); }

.layout { display: grid; }
@media (min-width: 960px) { .layout { grid-template-columns: 264px minmax(0, 1fr); } }
aside { background: var(--side); border-right: 1px solid var(--line); padding: var(--s6) var(--s4); font-size: 14px; }
@media (min-width: 960px) { aside { position: sticky; top: 56px; height: calc(100dvh - 56px); overflow-y: auto; } }
aside details summary { cursor: pointer; font-weight: 600; list-style: none; }
@media (min-width: 960px) { aside details summary { display: none; } }
aside h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin: var(--s6) 0 var(--s2); }
aside ul { list-style: none; padding: 0; }
aside li a { display: block; padding: 3px var(--s3); border-radius: 6px; text-decoration: none; color: var(--muted); border-left: 2px solid transparent; }
aside li a:hover { color: var(--ink); background: var(--code); }
aside li a.on { color: var(--ink); border-left-color: var(--accent); background: var(--code); }

main { padding: var(--s8) var(--s4) var(--s16); }
@media (min-width: 960px) { main { padding: var(--s12) var(--s16) var(--s16); } }
.doc { max-width: 760px; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: var(--s3); }
h1 { font-size: clamp(36px, 5vw, 52px); line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
.lead { font-size: 19px; color: var(--muted); margin-top: var(--s4); max-width: 60ch; }
h2 { font-size: 28px; font-weight: 650; letter-spacing: -0.01em; margin: var(--s16) 0 var(--s4); padding-top: var(--s6); border-top: 1px solid var(--line); }
h3 { font-size: 20px; font-weight: 600; margin: var(--s12) 0 var(--s3); }
h3 .anchor { color: var(--muted); text-decoration: none; margin-left: var(--s2); opacity: 0; }
h3:hover .anchor, h3 .anchor:focus { opacity: 1; }
p + p { margin-top: var(--s4); }

table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: var(--s6); }
th, td { text-align: left; padding: var(--s2) 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { width: 140px; font-weight: 500; color: var(--muted); }
td .tags { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); }
.btns { display: flex; gap: var(--s3); flex-wrap: wrap; margin-top: var(--s6); }
.btn { display: inline-flex; align-items: center; height: 40px; padding: 0 var(--s4); border-radius: 6px; text-decoration: none; font-weight: 500; font-size: 15px; border: 1px solid var(--line); white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.frame { margin-top: var(--s4); aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code); display: grid; place-items: center; color: var(--muted); font-size: 14px; }
.frame video, .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.badge { font-size: 12px; font-weight: 500; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 0 var(--s2); margin-left: var(--s2); vertical-align: middle; }

.callout { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: var(--s4); margin-top: var(--s6); font-size: 15px; }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s6); margin-top: var(--s6); }
.skills h4 { font-size: 14px; font-weight: 600; margin-bottom: var(--s2); }
.skills ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: var(--s2); }

form { display: grid; gap: var(--s4); margin-top: var(--s6); }
.field { display: grid; gap: var(--s1); }
label { font-weight: 500; font-size: 14px; }
input, textarea { font: inherit; padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
input::placeholder, textarea::placeholder { color: var(--muted); }
textarea { min-height: 128px; }
.send { justify-self: start; cursor: pointer; }
.pager { margin-top: var(--s16); padding-top: var(--s6); border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: var(--s4); }
.pager a { text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="#overview">Cauê Souza</a>
  <div class="right">
    <a class="ext" href="https://blog.eucaue.online">Blog</a>
    <a class="ext" href="https://github.com/EuCaue">GitHub</a>
    <button class="icon-btn" aria-label="Change language">EN</button>
    <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">Theme</button>
  </div>
</div>
<div class="layout">
  <aside>
    <details id="sidenav"><summary>Contents</summary>
      <nav aria-label="Contents" id="nav"></nav>
    </details>
  </aside>
  <main>
    <article class="doc" id="doc"></article>
  </main>
</div>
<script src="data.js"></script>
<script>
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
const featured = PROJECTS.filter(p => p.featured), other = PROJECTS.filter(p => !p.featured);
const link = p => `<li><a href="#${slug(p.name)}">${p.name}</a></li>`;
document.getElementById("nav").innerHTML = `
  <h4>Start</h4><ul><li><a href="#overview">Overview</a></li><li><a href="#about">About</a></li><li><a href="#contact">Contact</a></li></ul>
  <h4>Featured Projects</h4><ul>${featured.map(link).join("")}</ul>
  <h4>Other Projects</h4><ul>${other.map(link).join("")}</ul>`;
if (innerWidth >= 960) document.getElementById("sidenav").open = true;

const projectDoc = p => `
  <h3 id="${slug(p.name)}">${p.name}${p.preview ? '<span class="badge">Published</span>' : ""}<a class="anchor" href="#${slug(p.name)}" aria-label="Link to ${p.name}">#</a></h3>
  <p>${p.desc}</p>
  ${p.featured ? `<div class="frame">${media(p) || "No preview available"}</div>` : ""}
  <table>
    <tr><th scope="row">Platform</th><td>${p.platform}</td></tr>
    <tr><th scope="row">Stack</th><td><span class="tags">${p.tags.map(t => `<code>${t}</code>`).join("")}</span></td></tr>
    ${p.github ? `<tr><th scope="row">Source</th><td><a href="${p.github}">${p.github.replace("https://", "")}</a></td></tr>` : ""}
    ${p.preview ? `<tr><th scope="row">Live</th><td><a href="${p.preview}">Live Demo</a></td></tr>` : ""}
  </table>`;

document.getElementById("doc").innerHTML = `
  <section id="overview">
    <p class="crumb">Overview</p>
    <h1>Cauê Souza</h1>
    <p class="lead">Software Engineer passionate about building complete digital solutions from web and mobile applications to native desktop integrations and system-level tooling.</p>
    <table>
      <tr><th scope="row">Role</th><td>Software Engineer</td></tr>
      <tr><th scope="row">Location</th><td>Salvador, Brazil</td></tr>
      <tr><th scope="row">Email</th><td><a href="mailto:souzacaue@proton.me">souzacaue@proton.me</a></td></tr>
      <tr><th scope="row">Elsewhere</th><td><a href="https://linkedin.com/in/caue-souza">LinkedIn</a>, <a href="https://github.com/EuCaue">GitHub</a>, <a href="https://eucaue.online">eucaue.online</a></td></tr>
    </table>
    <div class="btns"><a class="btn primary" href="#">Download CV</a><a class="btn" href="#contact">Get In Touch</a></div>
  </section>
  <section><h2 id="featured">Featured Projects</h2>${featured.map(projectDoc).join("")}</section>
  <section><h2 id="other">Other Projects</h2>${other.map(projectDoc).join("")}</section>
  <section id="about"><h2>About Me</h2>
    <p>I'm a software engineer who enjoys working across different layers of technology. My experience spans modern, responsive interfaces for web and mobile (React, Next.js, React Native) all the way to native desktop applications and system extensions for Linux/GNOME built with Python and JavaScript.</p>
    <p>I believe in using technology to solve real-world problems simply and efficiently. I combine technical rigor, sound design principles, and smart automation in my daily workflow to build experiences that are robust under the hood and seamless for the user.</p>
    <div class="skills">${SKILLS.map(([h, items]) => `<div><h4>${h}</h4><ul>${items.map(s => `<li><code>${s}</code></li>`).join("")}</ul></div>`).join("")}</div>
  </section>
  <section id="contact"><h2>Get In Touch</h2>
    <p>Have a project in mind or just want to say hello? Feel free to reach out!</p>
    <form onsubmit="event.preventDefault()">
      <div class="field"><label for="n">Name</label><input id="n" placeholder="Your name" autocomplete="name"></div>
      <div class="field"><label for="e">Email</label><input id="e" type="email" placeholder="Your email" autocomplete="email"></div>
      <div class="field"><label for="m">Message</label><textarea id="m" placeholder="Your message"></textarea></div>
      <button class="btn primary send" type="submit">Send Message</button>
    </form>
  </section>
  <footer class="pager"><span>© 2026 Cauê Souza. All rights reserved.</span><a href="https://eucaue.online">eucaue.online</a><a href="https://blog.eucaue.online">Blog</a><a href="#">Resume</a></footer>`;

// Sidebar marks the section in view.
const links = [...document.querySelectorAll("aside a")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-56px 0px -70% 0px" });
document.querySelectorAll("#doc [id]").forEach(el => io.observe(el));
</script>
</body>
</html>
