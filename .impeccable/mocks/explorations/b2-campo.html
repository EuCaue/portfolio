<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2 · Campo verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
/* One drenched green field carries the opening; everything after is paper. */
.field-hero { background: var(--accent); color: var(--on-accent); min-height: calc(92dvh - 64px); display: flex; flex-direction: column; justify-content: flex-end; padding: var(--s8) 0 var(--s12); }
.field-hero > .wrap { width: 100%; min-width: 0; }
.field-hero h1 span { display: inline-block; }
.field-hero h1 { overflow: hidden; font-weight: 900; font-variation-settings: "wdth" 62; text-transform: uppercase; line-height: 0.9; padding-top: 0.06em; white-space: nowrap; font-size: 18vw; letter-spacing: -0.01em; }
.under { display: grid; gap: var(--s6); margin-top: var(--s8); border-top: 2px solid currentColor; padding-top: var(--s6); }
@media (min-width: 1024px) { .under { grid-template-columns: 4fr 5fr auto; align-items: start; gap: var(--s12); } }
.under .role { font-size: clamp(22px, 2.2vw, 30px); font-weight: 650; font-variation-settings: "wdth" 115; line-height: 1.15; }
.under .role span { display: block; font-weight: 400; font-size: 17px; font-variation-settings: "wdth" 100; opacity: 0.85; margin-top: var(--s1); }
.under p { max-width: 54ch; }
.field-hero .btn { border-color: var(--on-accent); }
.field-hero .btn.primary { background: var(--on-accent); color: #00602f; }
.field-hero :focus-visible { outline-color: var(--on-accent); }

#projects { border-top: 0; }
.idx { font-size: clamp(30px, 5.2vw, 84px); line-height: 1.0; font-weight: 750; font-variation-settings: "wdth" 62; text-transform: uppercase; }
.idx button { background: none; border: 0; padding: 0; cursor: pointer; text-transform: inherit; font-weight: inherit; line-height: inherit; text-align: left; }
.idx button.other { color: var(--muted); font-weight: 350; }
.idx button[aria-pressed="true"] { color: var(--accent-ink); }
.idx .sep { color: var(--line); padding: 0 0.16em; font-weight: 300; }
.stage { display: grid; gap: var(--s8); margin-top: var(--s16); padding-top: var(--s8); border-top: 2px solid var(--ink); }
@media (min-width: 1024px) { .stage { grid-template-columns: 7fr 5fr; gap: var(--s12); } .stage .frame { grid-row: span 6; } }
.stage h3 { margin-top: 0; }
</style>
</head>
<body>
<main>
  <div class="field-hero">
    <div class="wrap">
      <h1 id="name"><span>Cauê Souza</span></h1>
      <div class="under">
        <p class="role">Software Engineer<span>Salvador, Brazil</span></p>
        <p>Software Engineer passionate about building complete digital solutions from web and mobile applications to native desktop integrations and system-level tooling.</p>
        <div class="ctas"><a class="btn primary" href="#">Download CV</a><a class="btn" href="#projects">View My Work</a></div>
      </div>
    </div>
  </div>
  <section id="projects">
    <div class="wrap">
      <h2>Projects</h2>
      <p class="idx" id="idx"></p>
      <article class="panel stage" id="panel" aria-live="polite"></article>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
document.querySelector("main").insertAdjacentHTML("beforeend", ABOUT + CONTACT());
chrome();
const idx = document.getElementById("idx"), panel = document.getElementById("panel");
idx.innerHTML = PROJECTS.map((p, i) =>
  `<button type="button" class="${p.featured ? "" : "other"}" data-i="${i}" aria-pressed="false">${p.name}</button>`
).join('<span class="sep" aria-hidden="true">/</span>');
const select = i => {
  idx.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.i == i));
  panel.innerHTML = panelHTML(PROJECTS[i]);
};
idx.addEventListener("click", e => { const b = e.target.closest("button"); if (b) select(+b.dataset.i); });
select(0);

// Name spans the full measure on one line.
const name = document.getElementById("name");
const fit = () => { name.style.fontSize = "100px"; name.style.fontSize = 100 * name.clientWidth / name.firstElementChild.offsetWidth + "px"; };
document.fonts.ready.then(() => { fit(); proximity(name, { radius: 320, max: 76 }); });
addEventListener("resize", fit);
proximity(idx, { radius: 150 });
</script>
</body>
</html>
